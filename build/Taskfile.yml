# Common build tasks shared by the per-OS Taskfiles. Curated from the Wails v3
# svelte template: npm is the only package manager, and the template's server /
# docker / mobile tasks are omitted (out of scope for v1 — DESIGN.md §61.0, §62).
version: '3'

tasks:
  go:mod:tidy:
    summary: Runs `go mod tidy`
    internal: true
    # Universal/multi-arch builds invoke this concurrently from parallel deps;
    # two `go mod tidy` processes racing on go.mod can corrupt it.
    run: once
    cmds:
      - go mod tidy

  install:frontend:deps:
    summary: Install frontend dependencies
    run: once
    dir: frontend
    sources:
      - package.json
      - package-lock.json
    generates:
      # A real FILE, not the directory. The pinned Task runner's fingerprint
      # glob discards directory matches, so `node_modules` resolved to an empty
      # list and the checksum checker then returned false unconditionally — the
      # task re-ran on every invocation however unchanged the manifests were.
      # npm writes node_modules/.package-lock.json as its own generated record
      # of the installed tree. It is NOT a success marker — a failed
      # postinstall can leave it in place — so it is not what makes a broken
      # install retry. That comes from the runner: Task discards its saved
      # checksum when a command fails, so the next invocation installs again.
      # Delete the record, or change a manifest, and the install also runs.
      - node_modules/.package-lock.json
    preconditions:
      - sh: npm version
        msg: "npm not found. It ships with Node: https://nodejs.org/en/download/"
    cmds:
      # `npm ci` and not `npm install`, because a build must not rewrite a
      # tracked file. `npm install` re-resolves and writes package-lock.json,
      # which left the tree modified on every build: the build identity then
      # stamped every artifact `.dirty`, and the Windows release job's
      # source-identity guard threw "Build changed source inputs" and failed.
      # `npm ci` installs exactly the lock and never writes it; if the lock and
      # package.json disagree it fails loudly, which is what a release build
      # should do rather than quietly resolving something else. `npm ci` does
      # remove and recreate node_modules, so it is only affordable because the
      # `generates` file above lets the task actually be skipped — without that
      # it ran on every invocation: once in `make build`, and again in a
      # subsequent, separate `make rpm`. Updating a dependency is a
      # deliberate `npm install` in frontend/, committed.
      - npm ci

  build:frontend:
    label: build:frontend (DEV={{.DEV}})
    summary: Build the frontend project
    run: once
    dir: frontend
    sources:
      - "**/*"
      - exclude: node_modules/**/*
    generates:
      - dist/**/*
    deps:
      - task: install:frontend:deps
      - task: generate:bindings
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
    cmds:
      - npm run -q {{if eq .DEV "true"}}build:dev{{else}}build{{end}}
    env:
      PRODUCTION: '{{if eq .DEV "true"}}false{{else}}true{{end}}'

  generate:bindings:
    summary: Generates typed frontend bindings for the bound Go services (§55)
    run: once
    deps:
      - task: go:mod:tidy
    sources:
      - "**/*.[jt]s"
      - exclude: frontend/**/*
      - frontend/bindings/**/*
      - "**/*.go"
      - go.mod
      - go.sum
    generates:
      - frontend/bindings/**/*
    cmds:
      - wails3 generate bindings -f '{{.BUILD_FLAGS}}' -clean=true -ts -i

  generate:icons:
    summary: Generates Windows `.ico` and macOS `.icns`/`Assets.car` from build/appicon.png
    run: once
    dir: build
    sources:
      - "appicon.png"
      - "appicon.icon"
    generates:
      - "darwin/icons.icns"
      - "windows/icon.ico"
    cmds:
      - wails3 generate icons -input appicon.png -macfilename darwin/icons.icns -windowsfilename windows/icon.ico -iconcomposerinput appicon.icon -macassetdir darwin

  dev:frontend:
    summary: Runs the frontend in development mode
    deps:
      - task: install:frontend:deps
    dir: frontend
    cmds:
      - npm run dev -- --port {{.VITE_PORT}} --strictPort

  update:build-assets:
    summary: Updates the build assets from build/config.yml
    dir: build
    cmds:
      - wails3 update build-assets -name "{{.APP_NAME}}" -binaryname "{{.APP_NAME}}" -config config.yml -dir .
