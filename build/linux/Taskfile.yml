# Linux build/package tasks. Curated from the Wails v3 template: native CGO
# builds only (no docker cross-compile path), and packaging targets the formats
# the Tier-1 baseline actually uses — rpm, deb, AppImage (DESIGN.md §6.6, §61).
# Signing tasks are added in Phase 7.
version: '3'

includes:
  common: ../Taskfile.yml

tasks:
  build:
    summary: Builds the application for Linux
    deps:
      - task: common:go:mod:tidy
      - task: common:build:frontend
        vars:
          BUILD_FLAGS:
            ref: .BUILD_FLAGS
          DEV:
            ref: .DEV
    preconditions:
      - sh: command -v gcc >/dev/null 2>&1 || command -v clang >/dev/null 2>&1
        msg: "A C compiler is required (the webview binds via CGO): install gcc or clang."
    cmds:
      - go run ./build/identity build -os linux -arch {{.ARCH | default ARCH}} -output "{{.OUTPUT}}" -dev={{.DEV | default "false"}}
    vars:
      # Production builds carry `-tags production`, which compiles the wails
      # DevTools capability out entirely (§55).
      BUILD_FLAGS: '{{if eq .DEV "true"}}-gcflags=all="-l"{{else}}-tags production{{end}}'
      DEFAULT_OUTPUT: '{{.BIN_DIR}}/{{.APP_NAME}}'
      OUTPUT: '{{ .OUTPUT | default .DEFAULT_OUTPUT }}'

  package:
    summary: Packages the application for Linux (rpm, deb, AppImage)
    deps:
      - task: build
    cmds:
      - task: create:rpm
      - task: create:deb
      - task: create:appimage

  create:appimage:
    summary: Creates an AppImage
    deps:
      - task: build
      - task: generate:dotdesktop
    cmds:
      - go run ./build/identity appimage

  create:deb:
    summary: Creates a deb package
    deps:
      - task: build
      - task: fetch:engine
      - task: generate:dotdesktop
    cmds:
      - go run ./build/identity package -format deb

  create:rpm:
    summary: Creates an rpm package
    deps:
      - task: build
      - task: fetch:engine
      - task: generate:dotdesktop
    cmds:
      - go run ./build/identity package -format rpm

  fetch:engine:
    summary: Fetches the verified pinned rclone the packages carry (ADR 0089)
    run: once
    cmds:
      # Into the bin directory, beside the built binary: nfpm maps it to the
      # package's libexec path and the release tarball carries it as is.
      - ./scripts/fetch-rclone.sh linux {{.ARCH | default ARCH}} {{.BIN_DIR}}

  generate:dotdesktop:
    summary: Generates a `.desktop` file
    dir: build
    cmds:
      - mkdir -p {{.ROOT_DIR}}/build/linux/appimage
      - wails3 generate .desktop -name "{{.APP_NAME}}" -exec "{{.EXEC}}" -icon "{{.ICON}}" -outputfile "{{.ROOT_DIR}}/build/linux/{{.APP_NAME}}.desktop" -categories "{{.CATEGORIES}}"
    vars:
      EXEC: '{{.APP_NAME}}'
      ICON: '{{.APP_NAME}}'
      CATEGORIES: 'Utility;FileTools;'

  run:
    cmds:
      - '{{.BIN_DIR}}/{{.APP_NAME}}'
