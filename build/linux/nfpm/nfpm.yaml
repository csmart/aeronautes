# nfpm packaging config for deb/rpm — https://nfpm.goreleaser.com
name: "aeronautes"
arch: ${GOARCH}
platform: "linux"
version: "0.1.0"
section: "utils"
priority: "optional"
maintainer: Chris Smart <distroguy@gmail.com>
description: "Desktop operator workbench for OpenStack Swift"
vendor: "Aeronautes"
homepage: "https://github.com/csmart/aeronautes"
license: "Apache-2.0"
release: "1"

contents:
  - src: "./bin/aeronautes"
    dst: "/usr/local/bin/aeronautes"
  - src: "./build/appicon.png"
    dst: "/usr/share/icons/hicolor/128x128/apps/aeronautes.png"
  - src: "./build/linux/aeronautes.desktop"
    dst: "/usr/share/applications/aeronautes.desktop"

# Runtime dependencies for the GTK4 + WebKitGTK 6.0 stack (ADR 0010),
# plus the transfer engine: Linux packages depend on the DISTRO rclone
# (§61.1 — the version pin tracks Fedora's build; macOS/Windows bundles
# carry the checksummed official binary instead).
# Debian-family names first, distro overrides below.
depends:
  - libgtk-4-1
  - libwebkitgtk-6.0-4
  - rclone

overrides:
  # Fedora is the first-class Tier-1 target (K-PLAT-002).
  rpm:
    depends:
      - gtk4
      - webkitgtk6.0
      - rclone

scripts:
  postinstall: "./build/linux/nfpm/scripts/postinstall.sh"
