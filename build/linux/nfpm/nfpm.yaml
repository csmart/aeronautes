# nfpm packaging config for deb/rpm — https://nfpm.goreleaser.com
name: "aeronautes"
arch: "{{.Arch}}"
platform: "linux"
version: "{{.PackageVersion}}"
section: "utils"
priority: "optional"
maintainer: Chris Smart <distroguy@gmail.com>
description: "Desktop operator workbench for OpenStack Swift ({{.Version}}; source {{.SourceRevision}}; {{.SourceDirty}})"
vendor: "Aeronautes"
homepage: "https://github.com/csmart/aeronautes"
license: "Apache-2.0"
release: "1"

contents:
  - src: {{printf "%q" .Binary}}
    dst: "/usr/local/bin/aeronautes"
  - src: "./bin/build-identity/identity.json"
    dst: "/usr/share/doc/aeronautes/build-identity.json"
  - src: "./build/appicon.png"
    dst: "/usr/share/icons/hicolor/128x128/apps/aeronautes.png"
  - src: "./build/linux/aeronautes.desktop"
    dst: "/usr/share/applications/aeronautes.desktop"
  # The verified official pinned rclone (ADR 0089): off PATH, in the
  # package's own libexec, where the application probes ../libexec/aeronautes
  # relative to its executable. The build fetches it into ./bin first.
  - src: "./bin/rclone"
    dst: "/usr/local/libexec/aeronautes/rclone"
    file_info:
      mode: 0755
  # The engine is redistributed, so its licence notice travels with it.
  - src: "./NOTICE"
    dst: "/usr/share/doc/aeronautes/NOTICE"

# Runtime dependencies for the GTK4 + WebKitGTK 6.0 stack (ADR 0010).
# The transfer engine is NOT a dependency: the package carries the
# checksummed official binary above (ADR 0089), because a distribution
# rclone changes version on the distribution's schedule and the runner
# accepts exactly the pinned one.
# Debian-family names first, distro overrides below.
depends:
  - libgtk-4-1
  - libwebkitgtk-6.0-4

overrides:
  # Fedora is the first-class Tier-1 target (K-PLAT-002).
  rpm:
    depends:
      - gtk4
      - webkitgtk6.0

scripts:
  postinstall: "./build/linux/nfpm/scripts/postinstall.sh"
