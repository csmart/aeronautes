# Wails v3 project configuration (there is no wails.json in v3 — see DESIGN.md §7).
# This is the development configuration. Release identity is resolved by
# build/identity; the curated native templates are rendered into bin/.
version: '3'

# This information is used to generate the build assets.
info:
  companyName: "Aeronautes"
  productName: "Aeronautes"
  productIdentifier: "io.csmart.aeronautes"
  description: "Desktop operator workbench for OpenStack Swift"
  copyright: "(c) 2026 Chris Smart"
  comments: "Swift-aware browsing, inspection, and data movement"
  version: "0.0.0"

# Dev mode configuration
dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
    file:
      - .DS_Store
      - .gitignore
      - .gitkeep
      - "*_test.go"
    watched_extension:
      - "*.go"
      - "*.js"
      - "*.ts"
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary
