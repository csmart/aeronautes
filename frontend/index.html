<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- §55/§65.6 hardening: the webview may load nothing from anywhere
      but its own bundled assets and the Wails bridge (ipc: on some
      platforms; XHR to the same origin). No remote JS/CSS/fonts/images
      ever; inline styles are Svelte's compiled output. Swift endpoints
      are reached ONLY by the Go side — the webview never talks to a
      cluster. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' ipc:; object-src 'none'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"
    />
    <title>Aeronautes</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
