# The real-cloud Keystone v3 oracle, as its own workflow on purpose. Keeping it
# out of ci.yml leaves the required workflow's job set unchanged, and with it
# every gate that counts those jobs: the real Keystone backends are an external
# dependency, so a cloud outage or an expired credential must never block a
# merge. It reports its own status and skips green when the ORACLE_CLOUDS_YAML
# secret is absent (fork PRs receive no secrets), and the test skips each cloud
# not in the file. See docs/CI.md.
name: Real-cloud oracle

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: realcloud-oracle-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  realcloud_oracle:
    name: Real-cloud oracle (non-blocking)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
      - name: Real-cloud Keystone v3 oracle
        env:
          ORACLE_CLOUDS_YAML: ${{ secrets.ORACLE_CLOUDS_YAML }}
        run: |
          trap 'rm -f "$RUNNER_TEMP/clouds.yaml"' EXIT
          printf '%s' "$ORACLE_CLOUDS_YAML" > "$RUNNER_TEMP/clouds.yaml"
          make oracle CLOUDS="$RUNNER_TEMP/clouds.yaml"
