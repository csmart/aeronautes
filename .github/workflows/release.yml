# §61.0 release matrix: three OS × two architectures, every artifact
# UNSIGNED for now — signing/notarisation is deliberately skipped (owner
# decision, §65.6) and the artifact names say so; nothing here fakes a
# signature. Each OS builds on a matched runner because Wails links the
# native webview via CGO; the arch dimension rides native-arch runners.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

env:
  # Branch dispatches are development builds; only a validated tag is a release.
  AERONAUTES_RELEASE_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Every job builds with the current Go patch release, as CI tests with:
# go.mod's `go 1.27.0` is the language floor, and installing it exactly
# would ship binaries without the standard library's later fixes.
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - name: webview build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev pkg-config
      - run: make tools
      # go:embed all:frontend/dist needs the built frontend before any Go
      # package (main included) can even parse.
      - name: frontend install + build
        run: cd frontend && npm ci && npm run build
      - name: Fetch pinned rclone (verified)
        run: |
          ./scripts/fetch-rclone.sh linux amd64 "$RUNNER_TEMP/rclone-pin"
          echo "$RUNNER_TEMP/rclone-pin" >> "$GITHUB_PATH"
          echo "AERONAUTES_OFFICIAL_RCLONE_DIR=$RUNNER_TEMP/rclone-pin" >> "$GITHUB_ENV"
      - run: go test -race -count=1 -timeout 20m ./...
      - run: cd frontend && npm run check && npm test

  linux:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - name: webview build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev pkg-config nfpm || \
          sudo apt-get install -y libgtk-4-dev libwebkitgtk-6.0-dev pkg-config
      - run: make tools
      - run: make build
      - name: packages (rpm + deb)
        run: make rpm deb
      - name: tarball
        run: |
          mkdir -p dist
          name=$(go run ./build/identity name)
          cp NOTICE bin/NOTICE
          cp bin/build-identity/identity.json bin/build-identity.json
          # bin/rclone is the verified pin the package tasks fetched
          # (ADR 0089); beside the executable is where the tarball's
          # resolver looks for it.
          tar -C bin -czf "dist/$name.tar.gz" aeronautes rclone NOTICE build-identity.json
          cp "bin/$name.rpm" "bin/$name.deb" dist/
          go run ./build/identity record
      # SIGNING (deliberately absent): rpm --addsign / debsigs would go
      # here once release keys exist. Artifacts are honestly UNSIGNED.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: linux-${{ matrix.arch }}-unsigned
          path: dist/*

  macos:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
          - arch: amd64
    # Both arches build on Apple Silicon: GitHub's free Intel macOS
    # runners are retired (macos-13 queued forever on the first matrix
    # run), and darwin-to-darwin cross-arch CGO is native — clang
    # targets x86_64 with the same SDK.
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - run: make tools
      # §61.1: bundle the checksummed official pinned rclone beside the
      # app binary; the runtime re-verifies it before first spawn.
      - name: bundle pinned rclone
        run: ./scripts/fetch-rclone.sh darwin ${{ matrix.arch }} bin
      # go install puts wails3 in ~/go/bin, which the runner image has
      # on PATH already.
      - run: wails3 task package ARCH=${{ matrix.arch }}
      - name: bundle (unsigned)
        run: |
          mkdir -p dist
          name=$(go run ./build/identity name)
          cp bin/rclone bin/aeronautes.app/Contents/MacOS/rclone
          cp NOTICE bin/aeronautes.app/Contents/Resources/NOTICE
          ditto -c -k --keepParent bin/aeronautes.app "dist/$name.zip"
          go run ./build/identity record
      # SIGNING/NOTARISATION (deliberately absent): codesign + notarytool
      # go here once an Apple Developer identity exists. Gatekeeper will
      # warn on these artifacts — that is the honest current state.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: macos-${{ matrix.arch }}-unsigned
          path: dist/*

  windows:
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            arch: amd64
          - runner: windows-11-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: inspect Windows checkout
        shell: pwsh
        run: |
          git config --show-origin --get-regexp 'core\.(autocrlf|eol|safecrlf)'
          if ($LASTEXITCODE -gt 1) { exit $LASTEXITCODE }
          git ls-files --eol go.mod frontend/bindings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sourceStatus = git status --porcelain --untracked-files=normal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($sourceStatus) { $sourceStatus; throw 'Checkout must start clean' }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
      - run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.27
      - name: build and verify Windows source identity
        shell: pwsh
        run: |
          wails3 task build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git ls-files --eol go.mod frontend/bindings
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sourceStatus = git status --porcelain --untracked-files=normal
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($sourceStatus) { $sourceStatus; throw 'Build changed source inputs' }
          $identity = Get-Content bin/build-identity/identity.json -Raw | ConvertFrom-Json
          if ($identity.sourceDirty -ne 'clean') { throw 'Build recorded dirty source' }
      # §61.1: the checksummed official pinned rclone rides the bundle.
      - name: bundle pinned rclone
        shell: bash
        run: ./scripts/fetch-rclone.sh windows ${{ matrix.arch }} bin
      - name: bundle (unsigned)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $artifactName = go run ./build/identity name
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item NOTICE bin\NOTICE
          Copy-Item bin/build-identity/identity.json bin/build-identity.json
          Compress-Archive -Path bin/aeronautes.exe,bin/rclone.exe,bin/NOTICE,bin/build-identity.json -DestinationPath "dist/$artifactName.zip"
          go run ./build/identity record
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      # SIGNING (deliberately absent): signtool goes here once a code-
      # signing certificate exists. SmartScreen will warn — honestly.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-${{ matrix.arch }}-unsigned
          path: dist/*
