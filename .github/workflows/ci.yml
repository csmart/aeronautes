# Fast test/lint loop — runs on every push and PR.
#
# The steps guard on whether the code exists yet, so this workflow is green on the
# design-only repo and activates automatically once `go.mod` / `frontend/` land.
#
# This is NOT the release pipeline. The full six-target build/sign matrix
# ({Linux,Windows,macOS} x {x86_64,aarch64}, per-OS runners + system webview deps)
# is added in Phase 0/7 — see docs/DESIGN.md §61.0.

name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go — fmt, vet, build, test (race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Detect Go module
        id: detect
        run: |
          if [ -f go.mod ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "No go.mod yet — skipping Go checks."
          fi
      # The Wails shell binds the system webview via CGO (§6.6, ADR 0010).
      - name: Install webview system dependencies (GTK4/WebKitGTK 6.0)
        if: steps.detect.outputs.present == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev
      # go:embed all:frontend/dist needs the built frontend before any Go
      # compile step; the committed frontend/bindings are used as-is.
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend for embedding
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: gofmt (no diffs)
        if: steps.detect.outputs.present == 'true'
        run: |
          diff=$(gofmt -l .)
          if [ -n "$diff" ]; then echo "gofmt needed on:"; echo "$diff"; exit 1; fi
      - name: go vet
        if: steps.detect.outputs.present == 'true'
        run: go vet ./...
      - name: go build
        if: steps.detect.outputs.present == 'true'
        run: go build ./...
      - name: go test -race
        if: steps.detect.outputs.present == 'true'
        run: go test -race -count=1 ./...

  frontend:
    name: Frontend — lint, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect frontend
        id: detect
        run: |
          if [ -f frontend/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "No frontend/ yet — skipping."
          fi
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: install
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: npm ci
      - name: lint
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: npm run lint --if-present
      - name: typecheck (svelte-check)
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: npm run check --if-present
      - name: build
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: npm run build --if-present
      - name: test
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: npm test --if-present

  # Integration against a real containerized Swift (§57.3): the adapter is
  # driven end to end over the §58 canonical fixtures — auth, listings, the
  # §14.3 encoding suite, HEAD/DLO/SLO semantics. This is the Phase 1 gate
  # artifact; the real SwiftStack target remains the §57.4 release check.
  saio:
    name: Integration — containerized Swift (SAIO)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Detect Go module
        id: detect
        run: |
          if [ -f go.mod ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "No go.mod yet — skipping."
          fi
      - name: Start SAIO
        if: steps.detect.outputs.present == 'true'
        run: docker run -d --name saio -p 127.0.0.1:8080:8080 docker.io/openstackswift/saio:latest
      - name: Wait for Swift
        if: steps.detect.outputs.present == 'true'
        run: |
          for i in $(seq 1 60); do
            if curl -sf -m 2 http://127.0.0.1:8080/info > /dev/null; then
              echo "Swift is up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Swift never came up"; docker logs saio | tail -50; exit 1
      - name: Run integration suite
        if: steps.detect.outputs.present == 'true'
        env:
          AERONAUTES_SAIO_AUTH_URL: http://127.0.0.1:8080/auth/v1.0
        run: go test -race -count=1 -v ./internal/integration
