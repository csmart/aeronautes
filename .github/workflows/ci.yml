# Tests and builds run for every PR and every push to master or main.
# The six-target release matrix lives in release.yml (DESIGN §61.0).

name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

# Keep every master result; only newer PR revisions supersede earlier runs.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  go:
    name: Go — fmt, vet, build, test (race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
      # The Wails shell binds the system webview via CGO (§6.6, ADR 0010).
      - name: Install webview and test dependencies (GTK4/WebKitGTK 6.0, D-Bus)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgtk-4-dev libwebkitgtk-6.0-dev dbus
      # go:embed all:frontend/dist needs the built frontend before any Go
      # compile step; the committed frontend/bindings are used as-is.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Build frontend for embedding
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: gofmt (no diffs)
        run: |
          diff=$(gofmt -l .)
          if [ -n "$diff" ]; then echo "gofmt needed on:"; echo "$diff"; exit 1; fi
      # The shell in scripts/ carries evidence, not convenience: the smoke
      # proves ADR 0082's capability switch from the shipped binary, and
      # scripts/app-process.sh decides whether a launched app is actually
      # stopped. A break there weakens a gate without failing anything, so it
      # is linted here. -x follows the sourced library instead of skipping it.
      # The version is printed because it is not pinned: this step's first run
      # failed on a finding the author's own shellcheck does not report, so a
      # future disagreement should name its tool rather than be guessed at.
      - name: shellcheck (scripts/*.sh, following sourced files)
        run: |
          shellcheck --version
          shellcheck -x scripts/*.sh
      - name: wails pins agree with the go module
        run: |
          ./scripts/wails-version-coherence-test.sh
          ./scripts/wails-version-coherence.sh
      - name: Verify patched Swift source and checker refusals
        run: make verify-swift-source
      - name: Test Swift diagnostic collection
        run: python3 scripts/saio-diagnostics-test.py
      - name: Test Swift logging startup
        run: python3 scripts/saio-start-test.py
      - name: Test Swift storage admission
        run: python3 scripts/saio-storage-check-test.py
      - name: Test Swift storage cleanup
        run: python3 scripts/saio-storage-cleanup-test.py
      - name: Test Swift test partition and coverage join
        run: python3 scripts/saio-partition-test.py
      - name: Test upstream Swift core against its local mock
        run: make test-swift-core
      - name: Test keychain protocol on an isolated D-Bus service
        run: make test-secret-service
      - name: go vet
        run: go vet ./...
      - name: go build
        run: go build ./...
      # ADR 0011: internal/ is plain Go — no webview/CGO imports. This
      # is what lets the saio job compile the integration tests without
      # webview headers; keep it pinned.
      - name: internal/ builds without CGO
        run: CGO_ENABLED=0 go build ./internal/...
      - name: bindings drift gate
        run: |
          go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.27
          ~/go/bin/wails3 task common:generate:bindings
          git diff --exit-code frontend/bindings || {
            echo '::error::generated bindings drifted from the Go services — run wails3 task common:generate:bindings and commit'
            exit 1
          }
      - name: Fetch pinned rclone (verified)
        run: |
          ./scripts/fetch-rclone.sh linux amd64 "$RUNNER_TEMP/rclone-pin"
          echo "$RUNNER_TEMP/rclone-pin" >> "$GITHUB_PATH"
          echo "AERONAUTES_OFFICIAL_RCLONE_DIR=$RUNNER_TEMP/rclone-pin" >> "$GITHUB_ENV"
      - name: go test -race
        run: go test -race -count=1 -parallel=3 ./...

  frontend:
    name: Frontend — lint, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: install
        working-directory: frontend
        run: npm ci
      # svelte-check IS the lint gate; a --if-present npm alias that
      # silently no-ops is worse than nothing (review M-12).
      - name: typecheck (svelte-check)
        working-directory: frontend
        run: npm run check
      - name: build
        working-directory: frontend
        run: npm run build
      - name: test (with coverage)
        working-directory: frontend
        run: npm run test:coverage
      # SOFT coverage floor: a drop below it turns this step red without
      # failing the pipeline (continue-on-error) — a warning, not a wall.
      # Accounting is WHOLE-SOURCE since the review wave (untested files
      # count), so this reads red until the 65.10 test war room raises
      # real component coverage — an honest red, not a lie to silence.
      - name: coverage floor (soft, 70%)
        continue-on-error: true
        working-directory: frontend
        run: |
          pct=$(python3 -c "import json; print(json.load(open('coverage/coverage-summary.json'))['total']['statements']['pct'])")
          echo "frontend statement coverage: ${pct}%"
          echo "$pct" > coverage-pct.txt
          python3 -c "import sys; sys.exit(0 if float('$pct') >= 70 else 1)"             || { echo '::warning::frontend coverage dropped below the 70% soft floor'; exit 1; }
      - name: coverage badge
        run: |
          pct=$(cat frontend/coverage-pct.txt 2>/dev/null || echo 0)
          ./scripts/coverage-badge.sh "ui coverage" "$pct" 70 badges/coverage-frontend.svg
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: badge-frontend
          path: badges/

  # Integration against a real containerized Swift (§57.3): the adapter is
  # driven end to end over the §58 canonical fixtures — auth, listings, the
  # §14.3 encoding suite, HEAD/DLO/SLO semantics. This is the Phase 1 gate
  # artifact; the real SwiftStack target remains the §57.4 release check.
  saio_tests:
    name: Swift tests — ${{ matrix.lane }}
    strategy:
      fail-fast: false
      matrix:
        lane: [main, heavy]
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      SAIO_IMAGE: docker.io/openstackswift/saio@sha256:18ddf9feb9d1f419751a66eace8d956ecdaf5a085dedcc54ae51c210447ea1fa
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
      - name: Prepare dedicated Swift storage
        timeout-minutes: 3
        run: |
          storage=$(timeout 5 mktemp -d "$RUNNER_TEMP/aeronautes-saio.XXXXXX")
          echo "SAIO_STORAGE_DIR=$storage" >> "$GITHUB_ENV"
          timeout 5 mkdir "$storage/data"
          timeout 5 truncate -s 4G "$storage/data.xfs"
          timeout -k 2 90 docker run --name saio-format --network none --user root \
            --mount "type=bind,src=$storage,dst=/fixture" --entrypoint timeout \
            "$SAIO_IMAGE" -k 2 60 /sbin/mkfs.xfs -f /fixture/data.xfs
          timeout -k 2 15 sudo mount -t xfs -o loop,noatime "$storage/data.xfs" "$storage/data"
          mount_source=$(timeout 5 findmnt -rn -M "$storage/data" -o SOURCE)
          filesystem=$(timeout 5 findmnt -rn -M "$storage/data" -o FSTYPE)
          test "$filesystem" = xfs
          backing=$(timeout 5 sudo losetup -ln -O BACK-FILE "$mount_source")
          test "$backing" = "$storage/data.xfs"
          echo "Swift data mount: $mount_source ($filesystem), backing file $backing"
          timeout 5 sudo chown 1000:1000 "$storage/data"
          timeout -k 2 20 docker run --name saio-storage-check --network none --user swift \
            --mount "type=bind,src=$storage/data,dst=/srv/node" \
            --mount "type=bind,src=$GITHUB_WORKSPACE/scripts/saio-storage-check.py,dst=/tmp/saio-storage-check.py,readonly" \
            --entrypoint timeout "$SAIO_IMAGE" -k 1 10 python3 /tmp/saio-storage-check.py
      - name: Start SAIO
        # A different host port catches helpers that ignore the configured endpoint.
        run: |
          docker create --name saio -p 127.0.0.1:18080:8080 --entrypoint python3 \
            --mount "type=bind,src=$SAIO_STORAGE_DIR/data,dst=/srv/node" \
            "$SAIO_IMAGE" /tmp/saio-start.py
          docker cp scripts/saio-start.py saio:/tmp/saio-start.py
          docker start saio
      - name: Wait for Swift
        run: |
          for i in $(seq 1 60); do
            if curl -sf -m 2 http://127.0.0.1:18080/info > /dev/null; then
              echo "Swift is up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "Swift never came up"; docker logs saio | tail -50; exit 1
      # The verified official pinned rclone joins PATH so the FULL suite
      # runs in CI (rclone-dependent tests would otherwise skip) and the
      # combined coverage number matches a developer machine.
      - name: Fetch pinned rclone (verified)
        run: |
          ./scripts/fetch-rclone.sh linux amd64 "$RUNNER_TEMP/rclone-pin"
          echo "$RUNNER_TEMP/rclone-pin" >> "$GITHUB_PATH"
          echo "AERONAUTES_OFFICIAL_RCLONE_DIR=$RUNNER_TEMP/rclone-pin" >> "$GITHUB_ENV"
      - name: Run selected internal Go tests (SAIO)
        shell: bash
        env:
          AERONAUTES_SAIO_AUTH_URL: http://127.0.0.1:18080/auth/v1.0
          AERONAUTES_REQUIRE_TWO_ACCOUNTS: "1"
          SAIO_LANE: ${{ matrix.lane }}
        run: |
          mkdir saio-results
          go list ./internal/... > saio-results/all-packages.txt
          go test -json -race -list . -coverpkg=./internal/... ./internal/... > saio-results/test-list.jsonl
          python3 scripts/saio-partition.py prepare "$SAIO_LANE" saio-results \
            --commit "$GITHUB_SHA" --go-version "$(go env GOVERSION)" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT"
          pattern=$(python3 scripts/saio-partition.py pattern)
          if [ "$SAIO_LANE" = heavy ]; then
            selection=(-run="$pattern")
            packages=(./internal/systemtest)
          else
            selection=(-skip="$pattern")
            packages=(./internal/...)
          fi
          set +e
          go test -json -v -race -count=1 -parallel=3 -timeout=25m \
            -coverprofile=saio-results/cover.out -coverpkg=./internal/... \
            "${selection[@]}" "${packages[@]}" | tee saio-results/events.jsonl
          # Capture both exits before any command resets PIPESTATUS.
          pipestatus=("${PIPESTATUS[@]}")
          go run ./internal/systemtest/cmd/scenariocov \
            -events saio-results/events.jsonl -test-exit "${pipestatus[0]}" \
            -expected-packages saio-results/expected-packages.txt \
            -out saio-results/scenario-coverage.json
          scenario_exit=$?
          python3 scripts/saio-partition.py check saio-results "${pipestatus[0]}" "${pipestatus[1]}"
          partition_exit=$?
          set -e
          test "$scenario_exit" = 0
          test "$partition_exit" = 0
      - name: Collect Swift and runner diagnostics
        if: always()
        timeout-minutes: 2
        run: python3 scripts/saio-diagnostics.py saio-diagnostics
      - name: Upload Swift and runner diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: saio-diagnostics-${{ matrix.lane }}
          path: saio-diagnostics/
          retention-days: 7
          if-no-files-found: warn
      # Keep each producer intact, including failed or incomplete evidence.
      - name: Upload Swift test evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: saio-tests-${{ matrix.lane }}
          path: saio-results/
          if-no-files-found: warn
      - name: Clean up owned Swift fixture
        if: always()
        timeout-minutes: 2
        run: |
          for container in saio saio-storage-check saio-format; do
            present=$(timeout 10 docker ps -a --filter "name=^/${container}$" --format '{{.Names}}')
            if [ -n "$present" ]; then
              test "$present" = "$container"
              timeout -k 2 15 docker rm -f "$container"
            fi
          done
          if [ -n "${SAIO_STORAGE_DIR:-}" ]; then
            test ! -L "$SAIO_STORAGE_DIR/data"
            if [ -d "$SAIO_STORAGE_DIR/data" ]; then
              if timeout 5 mountpoint -q "$SAIO_STORAGE_DIR/data"; then
                timeout -k 2 15 sudo umount "$SAIO_STORAGE_DIR/data"
              else
                mount_status=$?
                test "$mount_status" = 32
              fi
            else
              test ! -e "$SAIO_STORAGE_DIR/data"
            fi
            timeout 5 rm -f "$SAIO_STORAGE_DIR/data.xfs"
            if [ -d "$SAIO_STORAGE_DIR/data" ]; then
              timeout 5 rmdir "$SAIO_STORAGE_DIR/data"
            fi
            timeout 5 rmdir "$SAIO_STORAGE_DIR"
          fi

  saio:
    name: Integration — containerized Swift (SAIO)
    if: ${{ always() }}
    needs: saio_tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require both Swift fixtures to succeed
        env:
          PRODUCER_RESULT: ${{ needs.saio_tests.result }}
        run: test "$PRODUCER_RESULT" = success
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version: stable
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: saio-tests-main
          path: saio-main
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: saio-tests-heavy
          path: saio-heavy
      - name: Validate both selections and combine coverage
        run: |
          set +e
          python3 scripts/saio-partition.py join saio-main saio-heavy saio-combined \
            --commit "$GITHUB_SHA" --go-version "$(go env GOVERSION)" \
            --run-id "$GITHUB_RUN_ID" --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --baseline internal/scenariocontract/preservation-baseline.json
          join_exit=$?
          set -e
          mkdir -p saio-combined
          printf '%s\n' "$join_exit" > saio-combined/join-exit.txt
          test "$join_exit" = 0
          go tool cover -func=saio-combined/cover.out > saio-combined/coverage-functions.txt
          pct=$(awk '/^total:/ {gsub(/%/,"",$3); print $3}' saio-combined/coverage-functions.txt)
          test -n "$pct"
          echo "combined Go statement coverage: ${pct}%"
          echo "$pct" > coverage-pct.txt
      - name: Upload combined coverage and scenario reports
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: scenario-coverage
          path: saio-combined/
          if-no-files-found: error
      # SOFT coverage floor: red step + warning on a drop, pipeline
      # continues (continue-on-error).
      - name: coverage floor (soft, 75%)
        continue-on-error: true
        run: |
          pct=$(cat coverage-pct.txt)
          python3 -c "import sys; sys.exit(0 if float('$pct') >= 75 else 1)"             || { echo '::warning::Go combined coverage dropped below the 75% soft floor'; exit 1; }
      - name: coverage badge
        run: |
          ./scripts/coverage-badge.sh "go coverage" "$(cat coverage-pct.txt)" 75 badges/coverage-go.svg
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: badge-go
          path: badges/

  # The headless release smoke (§65.8 item 6): the real binary under
  # Xvfb against the in-repo mock cluster, ending in a real engine copy
  # asserted server-side. A UI-breaking change cannot reach master
  # green.
  smoke:
    name: Smoke — headless app against mock Swift
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: system deps (webview build + headless display + capture)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends             libgtk-4-dev libwebkitgtk-6.0-dev pkg-config             xvfb xdotool imagemagick unzip
      - run: make tools
      - run: make build
      - name: pinned rclone on PATH
        run: |
          ./scripts/fetch-rclone.sh linux amd64 "$RUNNER_TEMP/rclone-pin"
          echo "$RUNNER_TEMP/rclone-pin" >> "$GITHUB_PATH"
      # The runner's container denies the user namespaces WebKit's
      # bubblewrap sandbox needs (bwrap: setting up uid map: Permission
      # denied), so the smoke — and only the smoke — runs the webview
      # unsandboxed here. The shipped application keeps its sandbox.
      - run: ./scripts/smoke.sh
        env:
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: "1"
          GTK_A11Y: none
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: smoke-artifacts
          path: smoke-artifacts/
          retention-days: 7

  required:
    name: CI — all required jobs passed
    if: ${{ always() }}
    needs: [go, frontend, saio, smoke]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Check gate refusals
        run: ./scripts/ci-gate-test.sh
      # GitHub accepts skipped status checks; this gate requires actual success.
      - name: Require every test job to succeed
        env:
          GO_RESULT: ${{ needs.go.result }}
          FRONTEND_RESULT: ${{ needs.frontend.result }}
          SAIO_RESULT: ${{ needs.saio.result }}
          SMOKE_RESULT: ${{ needs.smoke.result }}
        run: ./scripts/ci-gate.sh "$GO_RESULT" "$FRONTEND_RESULT" "$SAIO_RESULT" "$SMOKE_RESULT"
