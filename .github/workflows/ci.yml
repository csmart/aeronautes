# Fast test/lint loop — runs on every push and PR.
#
# The steps guard on whether the code exists yet, so this workflow is green on the
# design-only repo and activates automatically once `go.mod` / `frontend/` land.
#
# This is NOT the release pipeline. The full six-target build/sign matrix
# ({Linux,Windows,macOS} x {x86_64,aarch64}, per-OS runners + system webview deps)
# is added in Phase 0/7 — see docs/DESIGN.md §61.0. When the Wails GUI package needs
# system libraries (GTK / WebKitGTK), add an apt-get step here per the Wails v3 docs.
# A containerized-Swift (SAIO) integration job is added when Phase 1 starts (§57.3).

name: CI

on:
  push:
    branches: [master, main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    name: Go — fmt, vet, build, test (race)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Detect Go module
        id: detect
        run: |
          if [ -f go.mod ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "No go.mod yet — skipping Go checks."
          fi
      - name: gofmt (no diffs)
        if: steps.detect.outputs.present == 'true'
        run: |
          diff=$(gofmt -l .)
          if [ -n "$diff" ]; then echo "gofmt needed on:"; echo "$diff"; exit 1; fi
      - name: go vet
        if: steps.detect.outputs.present == 'true'
        run: go vet ./...
      - name: go build
        if: steps.detect.outputs.present == 'true'
        run: go build ./...
      - name: go test -race
        if: steps.detect.outputs.present == 'true'
        run: go test -race -count=1 ./...

  frontend:
    name: Frontend — lint, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Detect frontend
        id: detect
        run: |
          if [ -f frontend/package.json ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "No frontend/ yet — skipping."
          fi
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.present == 'true'
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: install
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: npm ci
      - name: lint
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: npm run lint --if-present
      - name: build
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: npm run build --if-present
      - name: test
        if: steps.detect.outputs.present == 'true'
        working-directory: frontend
        run: npm test --if-present
