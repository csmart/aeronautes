# Dependency update PRs (weekly, batched): Go modules, the frontend npm
# tree, and the Actions themselves. rclone is NOT here — its version is
# a product pin (docs/rclone.md): changes go through the compatibility
# matrix, never a bot PR.
version: 2
updates:
  - package-ecosystem: gomod
    directory: /
    schedule:
      interval: weekly
    # Wails is no longer muted. The operator's decision of 17 October 2026
    # was to ignore the bot while Wails 3 was in beta and to keep on top of
    # it once a stable release shipped; the project now pins the stable
    # 3.1.0, so the ignore range that bracketed 3.0.0's betas, here and for
    # @wailsio/runtime below, was removed: everything it matched is older
    # than the pin and would never be proposed. Stable Wails releases are
    # weekly minor bumps. A bot PR carrying one is a notification and not a
    # merge: the Go module and npm runtime must move together, while
    # scripts/wails.mjs derives the CLI version from the module. A coherent
    # upgrade is still a deliberate two-ecosystem change. Wails is left out
    # of the weekly groups, here
    # and for @wailsio/runtime below, so its notification arrives as a PR of
    # its own and never holds back the other updates it would be grouped with.
    groups:
      go-deps:
        patterns: ["*"]
        exclude-patterns: ["github.com/wailsapp/wails/v3"]
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    groups:
      npm-deps:
        patterns: ["*"]
        exclude-patterns: ["@wailsio/runtime"]
    ignore:
      # svelte-check peer-requires typescript ^5 || ^6; the TS 7 major
      # cannot even npm ci until the Svelte toolchain supports it.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
