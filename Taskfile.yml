version: '3'

vars:
  APP_NAME: "aeronautes"
  BIN_DIR: "bin"
  VITE_PORT: '{{.WAILS_VITE_PORT | default 9245}}'
  # Target OS for build/package/run; overridden by `wails3 build GOOS=...`.
  GOOS: '{{.GOOS | default OS}}'

# darwin/windows task includes land with the per-OS CI build matrix (§61.0);
# a Taskfile include must exist, so they are added when those builds do.
includes:
  common: ./build/Taskfile.yml
  linux: ./build/linux/Taskfile.yml

tasks:
  build:
    summary: Builds the application (production tags — DevTools compiled out, §55)
    cmds:
      - task: "{{.GOOS}}:build"

  package:
    summary: Packages a production build of the application
    cmds:
      - task: "{{.GOOS}}:package"

  run:
    summary: Runs the application
    cmds:
      - task: "{{.GOOS}}:run"

  dev:
    summary: Runs the application in development mode
    cmds:
      - wails3 dev -config ./build/config.yml -port {{.VITE_PORT}}
